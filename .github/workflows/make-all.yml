on: push
name: make all
jobs:
  makeall:
    name: make all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: make all
        uses: docker://golang:latest
        with:
          entrypoint: bash
          args: -c "git config --global --add safe.directory /github/workspace && go install honnef.co/go/tools/cmd/staticcheck@v0.7.0 && go install golang.org/x/lint/golint@v0.0.0-20241112194109-818c5a804067 && make all"
